name: Cross-platform integration

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]

jobs:
  # The Windows native host can only be compiled on Windows. Build the package
  # once here so every platform tests, and the release publishes, the same
  # tarball.
  package:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm pack

      - name: Verify packed tarball
        shell: bash
        run: node scripts/verify-release.js --tarball "$(ls keyshift-*.tgz)" --skip-registry

      - uses: actions/upload-artifact@v6
        with:
          name: keyshift-package
          path: keyshift-*.tgz
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - macos-15-intel
        node: [22]
        include:
          # The oldest Node.js release allowed by package.json "engines".
          - os: ubuntu-22.04
            node: 18
          - os: windows-latest
            node: 18
    name: integration (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # uiohook-napi has no working prebuilt binary for Linux arm64, so it is
      # compiled from source while the packed CLI is installed.
      - name: Install Linux arm64 build requirements
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libx11-dev libxtst-dev libxt-dev libxrandr-dev

      - run: npm ci
      - run: npm test

      - uses: actions/download-artifact@v7
        with:
          name: keyshift-package

      - name: Install packed CLI
        shell: bash
        run: |
          archive="$(ls keyshift-*.tgz)"
          if [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ARCH" == "ARM64" ]]; then
            export npm_config_build_from_source=true
          fi
          npm install --global --prefix "$RUNNER_TEMP/keyshift-prefix" "./$archive"

      - name: Install Linux integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xauth xvfb xclip xdotool x11-xkb-utils python3-tk

      - name: Linux X11 conversion
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          output="$(xvfb-run -a bash scripts/test-linux-x11.sh "$RUNNER_TEMP/keyshift-prefix/bin/keyshift" 2>&1)"
          status=$?
          echo "$output"
          if [[ $status -ne 0 ]]; then
            message="${output//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=Linux integration failure::$message"
            exit "$status"
          fi

      - name: macOS conversion
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          output="$(bash scripts/test-macos.sh "$RUNNER_TEMP/keyshift-prefix/bin/keyshift" 2>&1)"
          status=$?
          echo "$output"
          if [[ $status -ne 0 ]]; then
            message="${output//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=macOS integration failure::$message"
            exit "$status"
          fi

      # Hosted runners usually lack the Accessibility permission, so this is
      # informational only; the release workflow still requires the manual
      # confirmation from a real Mac.
      - name: macOS global shortcut (best effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          KEYSHIFT_TEST_GLOBAL_INPUT: "1"
        run: bash scripts/test-macos.sh "$RUNNER_TEMP/keyshift-prefix/bin/keyshift"

      - name: Windows conversion
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-shortcut.ps1 -KeyShiftCommand "$env:RUNNER_TEMP\keyshift-prefix\keyshift.cmd"

      - name: Print KeyShift logs
        if: failure()
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            log_path="$APPDATA/keyshift/keyshift.log"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            log_path="$HOME/Library/Application Support/keyshift/keyshift.log"
          else
            log_path="${XDG_CONFIG_HOME:-$HOME/.config}/keyshift/keyshift.log"
          fi
          [[ -f "$log_path" ]] && cat "$log_path" || true
